name: 侍 Renderizar samurai 3D

on:
  schedule:
    - cron: "17 4 * * *"      # uma vez por dia
  workflow_dispatch:           # permite rodar manualmente
  push:
    branches:
      - main
    paths:
      - scripts/samurai3d.py
      - .github/workflows/samurai3d.yml

jobs:
  render:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Blender (bpy) e dependências
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6
          pip install --quiet bpy imageio-ffmpeg

      - name: Renderizar o samurai com as contribuições
        run: python scripts/samurai3d.py --user "${{ github.repository_owner }}" --out render --samples 10 --width 800 --height 330
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Separar a animação
        run: mkdir -p dist3d && cp render/samurai3d.webp dist3d/

      - name: Publicar na branch output-3d
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output-3d
          build_dir: dist3d
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
